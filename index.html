<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAZ 73 - Super Voice AI by Ronish</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --dark-yellow: #F0C419;
            --bg-white: #FFFFFF;
            --bg-light: #FFFDF0;
            --text-dark: #333333;
            --gray-border: #E5E5E5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: var(--bg-white);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(240, 196, 25, 0.2);
        }

        @media (min-width: 481px) {
            .app-container {
                height: 85vh;
                border-radius: 16px;
                border: 2px solid var(--primary-yellow);
            }
        }

        header {
            background: var(--primary-yellow);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #222;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            font-size: 11px;
            background: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            color: #555;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .auth-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
        }

        h1 {
            color: #222;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--gray-border);
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--dark-yellow);
            box-shadow: 0 0 5px rgba(240, 196, 25, 0.4);
        }

        button {
            background: var(--primary-yellow);
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #222;
        }

        button:hover {
            background: var(--dark-yellow);
        }

        .chat-box {
            flex: 1;
            background: var(--bg-light);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #FDF0A6;
            margin-bottom: 15px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.ai {
            background: #FFFFFF;
            align-self: flex-start;
            border: 1px solid #EFEFEF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .message.user {
            background: var(--primary-yellow);
            color: #111;
            align-self: flex-end;
            font-weight: 500;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: #eee;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: none;
            width: auto;
        }

        .action-btn:hover {
            background: #ddd;
        }

        .action-btn.listening {
            background: #ff4d4d;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="brand">
                <h2>RAZ 73</h2>
                <span>Super Voice AI</span>
            </div>
            <div id="user-display" class="hidden" style="font-size: 13px; font-weight: normal;"></div>
        </header>

        <!-- SCREEN 1: LOGIN & LANGUAGE SETUP -->
        <div id="screen-auth" class="screen auth-screen">
            <div>
                <h1>RAZ 73</h1>
                <p class="subtitle">Your Super Voice Study & Multi-Purpose AI<br><small>Created by Ronish</small></p>
            </div>
            <div style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="username-input" placeholder="Enter your name...">
                <select id="language-select">
                    <option value="en-US">English</option>
                    <option value="es-ES">Español (Spanish)</option>
                    <option value="fr-FR">Français (French)</option>
                    <option value="zh-CN">中文 (Mandarin)</option>
                    <option value="hi-IN">हिन्दी (Hindi)</option>
                    <option value="ar-SA">العربية (Arabic)</option>
                    <option value="ja-JP">日本語 (Japanese)</option>
                    <option value="de-DE">Deutsch (German)</option>
                </select>
                <button onclick="startRazAI()">Initialize RAZ 73</button>
            </div>
        </div>

        <!-- SCREEN 2: MAIN VOICE CHAT DASHBOARD -->
        <div id="screen-chat" class="screen hidden">
            <div id="chat-box" class="chat-box">
                <!-- Messages populate here -->
            </div>

            <div id="image-preview-container" class="hidden" style="padding-bottom: 8px; font-size: 12px; color: #555;">
                📎 Photo attached for voice & visual breakdown.
            </div>

            <div class="input-area">
                <label for="image-input" class="action-btn" title="Upload Photo">📷</label>
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                
                <button id="mic-btn" class="action-btn" onclick="toggleVoiceInput()" title="Speak to RAZ 73">🎙️</button>

                <input type="text" id="user-input" placeholder="Type or tap mic to talk..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" style="width: auto; padding: 12px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = { name: "", language: "en-US", langName: "English" };
        let selectedImageBase64 = null;
        let recognition = null;
        let isListening = false;

        function startRazAI() {
            const nameInput = document.getElementById("username-input").value.trim();
            const langSelect = document.getElementById("language-select");
            
            if (!nameInput) {
                alert("Please enter your name, boss!");
                return;
            }

            currentUser.name = nameInput;
            currentUser.language = langSelect.value;
            currentUser.langName = langSelect.options[langSelect.selectedIndex].text;

            // Switch UI screens
            document.getElementById("screen-auth").classList.add("hidden");
            document.getElementById("screen-chat").classList.remove("hidden");
            
            const userDisplay = document.getElementById("user-display");
            userDisplay.textContent = `${currentUser.name} (${currentUser.langName})`;
            userDisplay.classList.remove("hidden");

            // Setup speech recognition if supported by browser
            setupSpeechRecognition();

            // Initial voice greeting from RAZ 73
            const welcomeText = `Hello ${currentUser.name}! I am RAZ 73, your super AI created by Ronish. I am listening and ready to help you study, edit, or handle anything you need. Speak or type to me anytime!`;
            appendMessage(welcomeText, 'ai');
            speakText(welcomeText);
        }

        function setupSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = currentUser.language;

                recognition.onresult = function(event) {
                    const speechToText = event.results[0][0].transcript;
                    document.getElementById("user-input").value = speechToText;
                    stopListeningState();
                    sendMessage(); // Automatically send after speaking
                };

                recognition.onerror = function() {
                    stopListeningState();
                };

                recognition.onend = function() {
                    stopListeningState();
                };
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert("Voice recognition is not supported on this browser. Try Chrome or Safari!");
                return;
            }

            if (isListening) {
                recognition.stop();
                stopListeningState();
            } else {
                try {
                    recognition.lang = currentUser.language;
                    recognition.start();
                    isListening = true;
                    document.getElementById("mic-btn").classList.add("listening");
                    document.getElementById("user-input").placeholder = "Listening... Speak now...";
                } catch (e) {
                    stopListeningState();
                }
            }
        }

        function stopListeningState() {
            isListening = false;
            const micBtn = document.getElementById("mic-btn");
            if (micBtn) micBtn.classList.remove("listening");
            const inputField = document.getElementById("user-input");
            if (inputField) inputField.placeholder = "Type or tap mic to talk...";
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentUser.language;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result;
                    document.getElementById("image-preview-container").classList.remove("hidden");
                }
                reader.readAsDataURL(file);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, sender, imgUrl = null) {
            const chatBox = document.getElementById("chat-box");
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);

            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            messageDiv.innerHTML = formattedText;

            if (imgUrl) {
                const img = document.createElement("img");
                img.src = imgUrl;
                messageDiv.appendChild(img);
            }

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();

            if (!text && !selectedImageBase64) return;

            appendMessage(text || "Uploaded an image for RAZ 73 to analyze.", 'user', selectedImageBase64);
            
            const currentImg = selectedImageBase64;
            inputField.value = "";
            selectedImageBase64 = null;
            document.getElementById("image-preview-container").classList.add("hidden");
            document.getElementById("image-input").value = "";

            setTimeout(() => {
                let aiResponse = generateRazResponse(text, currentImg);
                appendMessage(aiResponse, 'ai');
                speakText(aiResponse); // RAZ 73 speaks the answer back to you out loud!
            }, 600);
        }

        function generateRazResponse(query, img) {
            let lowerQuery = query.toLowerCase();

            if (img) {
                return `Visual data received, ${currentUser.name}! As RAZ 73, built by Ronish, I've scanned this image. It's fully processed. Let me know if you want me to read it out, break down study insights, or solve anything inside it.`;
            }

            if (lowerQuery.includes('study') || lowerQuery.includes('learn') || lowerQuery.includes('exam')) {
                return `Study mode is fully engaged. Tell me what topic you want to master, and RAZ 73 will guide you step by step.`;
            }

            if (lowerQuery.includes('edit') || lowerQuery.includes('code') || lowerQuery.includes('write')) {
                return `Editing and creation protocols active. Share what you'd like me to refine or fix for you right now.`;
            }

            return `I hear you loud and clear, ${currentUser.name}! RAZ 73 is operating at peak performance. What else should we conquer together today?`;
        }
    </script>
</body>
</html>
